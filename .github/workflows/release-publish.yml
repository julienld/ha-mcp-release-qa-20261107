name: Release Publish
on:
  workflow_run:
    workflows:
    - SemVer Release
    types:
    - completed
    branches:
    - main
    - master
  workflow_dispatch: null
env:
  REGISTRY: ghcr.io
concurrency:
  group: release-publish
  cancel-in-progress: false
  queue: max
jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    if: ${{ vars.QA_ARMED == 'true' && github.sha != vars.QA_BOOTSTRAP_SHA && (github.repository == 'julienld/ha-mcp-release-qa-20261107'
      && github.ref == 'refs/heads/master') }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: master
        fetch-depth: 0
    - name: Select the release from its producing run
      id: source
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        EVENT_NAME: ${{ github.event_name }}
      run: "set -euo pipefail\nif [ \"$EVENT_NAME\" = workflow_run ]; then\n  # Gated/no-change runs have no release artifact.\
        \ Master may have\n  # advanced since a real release: never infer this run's tag from it.\n  COUNT=$(gh api \"repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID/artifacts\"\
        \ \\\n    --jq '[.artifacts[] | select(.name == \"stable-release-tag\")] | length')\n  if [ \"$COUNT\" -eq 0 ]; then\n\
        \    echo \"No release was recorded by this SemVer run.\"\n    echo \"tag=\" >> \"$GITHUB_OUTPUT\"\n    exit 0\n \
        \ fi\n  gh run download \"$TRIGGER_RUN_ID\" --repo \"$GITHUB_REPOSITORY\" \\\n    --name stable-release-tag --dir\
        \ \"$RUNNER_TEMP/release-metadata\"\n  TAG=$(cat \"$RUNNER_TEMP/release-metadata/release-tag.txt\")\nelse\n  TAG=$(git\
        \ describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*dev*')\nfi\n[[ \"$TAG\" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+$\
        \ ]]\necho \"tag=$TAG\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Read metadata from the selected release tag
      id: version
      env:
        RELEASE_TAG: ${{ steps.source.outputs.tag }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\nif [ -z \"$RELEASE_TAG\" ]; then\n  echo \"should_publish=false\" >> \"$GITHUB_OUTPUT\"\n \
        \ exit 0\nfi\n# Stop an old completed run before any mutable channel is published.\nif git rev-parse --verify refs/tags/stable\
        \ >/dev/null 2>&1 && \\\n  ! git merge-base --is-ancestor 'stable^{commit}' \"$RELEASE_TAG^{commit}\"; then\n  echo\
        \ \"::notice::$RELEASE_TAG predates stable; ignoring this old retry.\"\n  echo \"should_publish=false\" >> \"$GITHUB_OUTPUT\"\
        \n  exit 0\nfi\nVERSION=$(git show \"$RELEASE_TAG:pyproject.toml\" \\\n  | grep '^version = ' | sed 's/version = \"\
        \\(.*\\)\"/\\1/')\n[ \"v$VERSION\" = \"$RELEASE_TAG\" ]\necho \"release_tag=$RELEASE_TAG\" >> \"$GITHUB_OUTPUT\"\n\
        echo \"version=$VERSION\" >> \"$GITHUB_OUTPUT\"\necho \"should_publish=true\" >> \"$GITHUB_OUTPUT\"\necho \"Building\
        \ from $RELEASE_TAG, regardless of later master commits.\"\n"
  publish_pypi:
    name: Publish PyPI package
    needs: prepare
    if: ${{ needs.prepare.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://julienld.github.io/ha-mcp-mirror-qa-20261107
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ needs.prepare.outputs.release_tag }}
        fetch-depth: 0
        submodules: true
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        version: 0.13.4
    - name: Build distribution
      run: uv build
    - name: Publish package to the isolated QA index
      run: uv run -s .qa/runtime.py publish-index --dist dist
      env:
        QA_DEPLOY_KEY: ${{ secrets.INTEGRATION_MIRROR_DEPLOY_KEY }}
  finalize_github_release:
    name: Finalize stable GitHub release
    needs:
    - prepare
    - publish_pypi
    if: ${{ github.repository == 'julienld/ha-mcp-release-qa-20261107' && github.ref == 'refs/heads/master' && needs.prepare.outputs.should_publish
      == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.workflow_sha }}
        path: publisher
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ needs.prepare.outputs.release_tag }}
        path: release-source
        fetch-depth: 0
    - name: Generate GitHub App token for the stable alias
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        app-id: ${{ secrets.RELEASE_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        permission-contents: write
      continue-on-error: true
      if: ${{ github.repository == 'homeassistant-ai/ha-mcp' }}
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        version: 0.13.4
    - name: QA observe state before the real finalizer
      run: uv run -s publisher/.qa/runtime.py pre-finalization --tag "$RELEASE_TAG"
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        QA_STAGE: ${{ vars.QA_STAGE }}
    - name: Finalize only after the package and requested asset are ready
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      run: "uv run -s publisher/scripts/finalize_github_release.py \\\n  --repository \"$GITHUB_REPOSITORY\" --tag \"$RELEASE_TAG\"\
        \ \\\n  --hacs release-source/hacs.json \\\n  --component release-source/custom_components/ha_mcp_tools/manifest.json\
        \ \\\n  --pyproject release-source/pyproject.toml --checkout release-source\n"
    - name: Record finalized stable tag
      env:
        RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      run: printf '%s\n' "$RELEASE_TAG" > finalized-release-tag.txt
    - name: Signal successful finalization to docs and mirror
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: finalized-release-tag
        path: finalized-release-tag.txt
        if-no-files-found: error
        overwrite: true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: qa-prefinalization
        path: qa-prefinalization.json
  publish_docker:
    name: Publish Docker image
    needs:
    - prepare
    - finalize_github_release
    if: ${{ needs.prepare.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ needs.prepare.outputs.release_tag }}
        fetch-depth: 0
        submodules: true
    - name: QA controlled failure after GitHub finalization
      if: ${{ vars.QA_FAIL_DOCKER == 'true' }}
      run: echo 'Controlled QA failure after finalization'; exit 1
    - name: Protect mutable image tags on a partial old rerun
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\nCURRENT=$(gh api \"repos/$GITHUB_REPOSITORY/releases/latest\" --jq .tag_name)\nif [ \"$CURRENT\"\
        \ != \"v$VERSION\" ]; then\n  echo \"::error::v$VERSION is no longer the current release; refusing to move stable/latest\
        \ images.\"\n  exit 1\nfi\n"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}
        tags: 'type=semver,pattern={{version}},value=${{ env.VERSION }}

          type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}

          type=semver,pattern={{major}},value=${{ env.VERSION }}

          type=raw,value=latest

          type=raw,value=stable

          '
    - name: Build and push Docker image
      uses: ./.github/actions/docker-build-python-base-fallback
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: 'BUILD_VERSION=${{ env.VERSION }}

          '
  publish_mcp:
    name: Publish MCP server manifest
    needs:
    - publish_pypi
    - publish_docker
    - prepare
    runs-on: ubuntu-latest
    if: ${{ always() && needs.prepare.outputs.should_publish == 'true' }}
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.version }}
    steps:
    - name: Report upstream job results
      run: 'echo "PyPI publish conclusion: ${{ needs.publish_pypi.result }}"

        echo "Docker publish conclusion: ${{ needs.publish_docker.result }}"

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: ${{ needs.publish_pypi.result == 'success' && needs.publish_docker.result == 'success' }}
      with:
        persist-credentials: false
        ref: ${{ needs.prepare.outputs.release_tag }}
        fetch-depth: 0
    - name: Install MCP Publisher CLI
      if: ${{ github.repository == 'homeassistant-ai/ha-mcp' }}
      env:
        MCP_PUBLISHER_VERSION: v1.7.9
        MCP_PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
      run: "set -euo pipefail\nos=\"$(uname -s | tr '[:upper:]' '[:lower:]')\"\narch=\"$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')\"\
        \ncurl -fsSL -o mcp-publisher.tar.gz \\\n  \"https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_${os}_${arch}.tar.gz\"\
        \necho \"${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz\" | sha256sum -c -\ntar xzf mcp-publisher.tar.gz mcp-publisher\n"
    - name: Render server manifest for publish
      if: ${{ needs.publish_pypi.result == 'success' && needs.publish_docker.result == 'success' }}
      run: "set -euo pipefail\npython scripts/render_server_manifest.py \\\n  --input server.json \\\n  --output server.json\
        \ \\\n  --version \"$VERSION\" \\\n  --oci-image \"$IMAGE\"\ncat server.json\n"
    - name: Install uv
      if: ${{ needs.publish_pypi.result == 'success' && needs.publish_docker.result == 'success' }}
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        version: 0.13.4
    - name: Validate server manifest
      if: ${{ needs.publish_pypi.result == 'success' && needs.publish_docker.result == 'success' }}
      run: 'set -euo pipefail

        uv run --frozen python scripts/validate_server_manifest.py server.json

        '
    - name: Login to MCP Registry
      if: ${{ github.repository == 'homeassistant-ai/ha-mcp' }}
      run: ./mcp-publisher login github-oidc
    - name: Retain the rendered MCP manifest without public registration
      if: ${{ needs.publish_pypi.result == 'success' && needs.publish_docker.result == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: qa-mcp-manifest
        path: server.json
    - name: Skip MCP publish
      if: ${{ needs.publish_pypi.result != 'success' || needs.publish_docker.result != 'success' }}
      run: 'echo "Skipping MCP publish because one or more upstream publish jobs failed."

        '
  qa_receipt:
    name: QA workflow receipt
    needs:
    - prepare
    - publish_pypi
    - finalize_github_release
    - publish_docker
    - publish_mcp
    if: ${{ always() && vars.QA_ARMED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.workflow_sha }}
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        version: 0.13.4
    - run: uv run -s .qa/runtime.py receipt
      env:
        QA_NEEDS: ${{ toJSON(needs) }}
        QA_STAGE: ${{ vars.QA_STAGE }}
        GH_TOKEN: ${{ github.token }}
        QA_REPORT_FAILURES: 'true'
        QA_OBSERVER_PR: ${{ vars.QA_OBSERVER_PR }}
        QA_OBSERVER_SHA: ${{ vars.QA_OBSERVER_SHA }}
        QA_FAIL_DOCKER: ${{ vars.QA_FAIL_DOCKER }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: qa-workflow-receipt
        path: qa-workflow-receipt.json
        retention-days: 30
