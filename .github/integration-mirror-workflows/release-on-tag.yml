name: Release on tag
on:
  push:
    tags:
    - v*
permissions:
  contents: write
concurrency:
  group: release-on-tag
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Extract tag message
      run: "# A lightweight tag has no message of its own \u2014 %(contents) on one\n# falls through to the pointed-to COMMIT's\
        \ message, so an emptiness\n# check cannot detect it (review finding). Check the tag object's\n# actual type instead:\
        \ only a real annotated tag (\"tag\" object)\n# carries the generated release notes; anything else gets the stub.\n\
        if [ \"$(git cat-file -t \"refs/tags/$GITHUB_REF_NAME\")\" = \"tag\" ]; then\n  git tag -l --format='%(contents)'\
        \ \"$GITHUB_REF_NAME\" > /tmp/notes.md\nelse\n  : > /tmp/notes.md\nfi\nif ! grep -q '[^[:space:]]' /tmp/notes.md;\
        \ then\n  echo \"Component snapshot synced from homeassistant-ai/ha-mcp.\" > /tmp/notes.md\nfi\n"
    - name: Copy the upstream integration ZIP
      if: hashFiles('.github/component-zip-source.json') != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\nEXPECTED_DIGEST=$(python3 -c \"import json; print(json.load(open('.github/component-zip-source.json'))['digest'])\"\
        )\n[[ \"$EXPECTED_DIGEST\" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1\n# gh's lookup includes drafts left by interrupted\
        \ uploads; the REST\n# tag endpoint only guarantees published releases.\nMIRROR_DIGEST=\"\"\nif MIRROR_RELEASE_ID=$(gh\
        \ release view \"$GITHUB_REF_NAME\" --repo \"$GITHUB_REPOSITORY\" \\\n  --json databaseId --jq .databaseId 2>/dev/null);\
        \ then\n  MIRROR_DIGEST=$(gh api \"repos/${GITHUB_REPOSITORY}/releases/${MIRROR_RELEASE_ID}\" \\\n    --jq '.assets[]\
        \ | select(.name == \"ha_mcp_tools.zip\" and .state == \"uploaded\" and .size > 0) | .digest')\nfi\nif [[ \"$MIRROR_DIGEST\"\
        \ =~ ^sha256:[0-9a-f]{64}$ ]]; then\n  if [ \"$MIRROR_DIGEST\" != \"$EXPECTED_DIGEST\" ]; then\n    echo \"::error::The\
        \ counted mirror asset differs from the tagged ZIP digest.\"\n    exit 1\n  fi\n  echo \"The mirror already has the\
        \ uploaded ZIP; preserving its download history.\"\n  exit 0\nfi\nSOURCE_REPOSITORY=$(python3 -c \"import json; print(json.load(open('.github/component-zip-source.json'))['repository'])\"\
        )\nSOURCE_TAG=$(python3 -c \"import json; print(json.load(open('.github/component-zip-source.json'))['tag'])\")\n\
        mkdir -p dist/integration\n# The stable publisher may still be finalizing its draft after PyPI\n# becomes available.\
        \ Copy the published asset; never rebuild it here.\nfor attempt in $(seq 1 40); do\n  DIGEST=$(gh api \"repos/${SOURCE_REPOSITORY}/releases/tags/${SOURCE_TAG}\"\
        \ \\\n    --jq '.assets[] | select(.name == \"ha_mcp_tools.zip\") | .digest' 2>/dev/null || true)\n  if [[ \"$DIGEST\"\
        \ =~ ^sha256:[0-9a-f]{64}$ ]]; then\n    if [ \"$DIGEST\" != \"$EXPECTED_DIGEST\" ]; then\n      echo \"::error::The\
        \ upstream ZIP changed after snapshot verification.\"\n      exit 1\n    fi\n    gh release download \"$SOURCE_TAG\"\
        \ --repo \"$SOURCE_REPOSITORY\" \\\n      --pattern ha_mcp_tools.zip --dir dist/integration --clobber\n    echo \"\
        ${EXPECTED_DIGEST#sha256:}  dist/integration/ha_mcp_tools.zip\" | sha256sum --check -\n    exit 0\n  fi\n  sleep 15\n\
        done\necho \"::error::The upstream integration ZIP was not published with a digest.\"\nexit 1\n"
    - name: Create release for tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\nVER=\"${GITHUB_REF_NAME#v}\"\n# Check existence explicitly instead of `|| echo \"release exists\"\
        `:\n# that pattern treated EVERY create failure (auth, rate limit, bad\n# notes file) as already-exists and reported\
        \ green with no release\n# published (review finding). Now only a genuine duplicate no-ops;\n# a real create failure\
        \ fails the job visibly.\nif MIRROR_RELEASE_ID=$(gh release view \"$GITHUB_REF_NAME\" --repo \"$GITHUB_REPOSITORY\"\
        \ \\\n  --json databaseId --jq .databaseId 2>/dev/null); then\n  # Backfill a missing asset on recovery without replacing\
        \ one that\n  # already has a download history.\n  DIGEST=$(gh api \"repos/${GITHUB_REPOSITORY}/releases/${MIRROR_RELEASE_ID}\"\
        \ \\\n    --jq '.assets[] | select(.name == \"ha_mcp_tools.zip\" and .state == \"uploaded\" and .size > 0) | .digest')\n\
        \  if [ -f .github/component-zip-source.json ] && [[ \"$DIGEST\" =~ ^sha256:[0-9a-f]{64}$ ]]; then\n    EXPECTED_DIGEST=$(python3\
        \ -c \"import json; print(json.load(open('.github/component-zip-source.json'))['digest'])\")\n    [ \"$DIGEST\" =\
        \ \"$EXPECTED_DIGEST\" ] || { echo \"::error::The mirror asset differs from the tagged ZIP digest.\"; exit 1; }\n\
        \  fi\n  if [ -f dist/integration/ha_mcp_tools.zip ] && ! [[ \"$DIGEST\" =~ ^sha256:[0-9a-f]{64}$ ]]; then\n    #\
        \ Replace only an incomplete upload, never a usable counted asset.\n    gh release upload \"$GITHUB_REF_NAME\" dist/integration/ha_mcp_tools.zip\
        \ --repo \"$GITHUB_REPOSITORY\" --clobber\n  fi\n  if [ \"$(gh release view \"$GITHUB_REF_NAME\" --repo \"$GITHUB_REPOSITORY\"\
        \ --json isDraft --jq .isDraft)\" = true ]; then\n    gh release edit \"$GITHUB_REF_NAME\" --repo \"$GITHUB_REPOSITORY\"\
        \ --draft=false\n  fi\n  echo \"release exists\"\n  exit 0\nfi\n# -dev. tags are the dev channel: the prerelease flag\
        \ is what keeps\n# them away from stable HACS users (HACS filters on it unless the\n# repository's \"Pre-release\"\
        \ switch entity is on) and out of\n# GitHub's \"latest\" release.\nPRERELEASE_FLAG=\"\"\ncase \"$GITHUB_REF_NAME\"\
        \ in\n  *-dev.*) PRERELEASE_FLAG=\"--prerelease\" ;;\nesac\nASSETS=()\nif [ -f dist/integration/ha_mcp_tools.zip ];\
        \ then\n  ASSETS+=(dist/integration/ha_mcp_tools.zip)\nfi\n# With an asset, gh stages the upload before publishing\
        \ and attempts\n# cleanup on failure; explicit --draft would disable that cleanup.\ngh release create \"$GITHUB_REF_NAME\"\
        \ \"${ASSETS[@]}\" --repo \"$GITHUB_REPOSITORY\" \\\n  --title \"$VER\" -F /tmp/notes.md $PRERELEASE_FLAG\n"
    - name: Retire superseded dev pre-releases
      if: ${{ !contains(github.ref_name, '-dev.') }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "VER=\"${GITHUB_REF_NAME#v}\"\n# Capture instead of piping into the loop: the default GHA shell\n# has no pipefail,\
        \ so a failed gh api would otherwise read as\n# \"nothing to retire\" and pass silently.\nTAGS=$(gh api --paginate\
        \ \"repos/${GITHUB_REPOSITORY}/releases\" \\\n  --jq '.[] | select(.prerelease) | .tag_name')\n# Process every tag,\
        \ THEN fail if any deletion errored: aborting\n# mid-loop (plain set -e) leaves later tags unprocessed, while\n# `||\
        \ echo warning` would mask a persistent failure forever - the\n# same anti-pattern the create step's history warns\
        \ about. A red\n# run here is self-healing (the release is already published and\n# the next stable release re-runs\
        \ the full scan).\nFAILED=0\nfor TAG in $TAGS; do\n  case \"$TAG\" in *-dev.*) ;; *) continue ;; esac\n  BASE=\"${TAG#v}\"\
        \n  BASE=\"${BASE%%-dev.*}\"\n  if [ \"$(printf '%s\\n%s\\n' \"$BASE\" \"$VER\" | sort -V | tail -n1)\" = \"$VER\"\
        \ ]; then\n    echo \"retiring superseded pre-release ${TAG}\"\n    gh release delete \"$TAG\" --repo \"$GITHUB_REPOSITORY\"\
        \ --yes --cleanup-tag || FAILED=1\n  else\n    echo \"keeping ${TAG} (newer than ${VER})\"\n  fi\ndone\nif [ \"$FAILED\"\
        \ -ne 0 ]; then\n  echo \"::error::one or more pre-release retirements failed; the next stable release re-runs the\
        \ scan\"\n  exit 1\nfi\n"
    - name: Keep the newest five dev pre-releases
      if: ${{ contains(github.ref_name, '-dev.') }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "TAGS=$(gh api --paginate \"repos/${GITHUB_REPOSITORY}/releases\" \\\n  --jq '.[] | select(.prerelease) | .tag_name')\n\
        # The listing can miss the release created moments ago, so count\n# this tag explicitly. Newest first by version,\
        \ so dev.1000 sorts\n# above dev.999.\nOLD=$(printf '%s\\n' \"$GITHUB_REF_NAME\" $TAGS | grep -e '-dev\\.' \\\n  |\
        \ sort -rV | uniq | tail -n +6)\nFAILED=0\nfor TAG in $OLD; do\n  echo \"pruning old pre-release ${TAG}\"\n  gh release\
        \ delete \"$TAG\" --repo \"$GITHUB_REPOSITORY\" --yes --cleanup-tag || FAILED=1\ndone\nif [ \"$FAILED\" -ne 0 ]; then\n\
        \  echo \"::error::one or more pre-release deletions failed; the next dev build re-runs the prune\"\n  exit 1\nfi\n"
    if: ${{ github.repository == 'julienld/ha-mcp-mirror-qa-20261107' && vars.QA_ARMED == 'true' }}
